<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
<title id="title">Boswas Group — Corporate Ecosystem</title>
<desc id="desc">Corporate website showcasing the Boswas ecosystem — its companies, products, innovations and long-term vision across tech, healthcare, AI &amp; enterprise. Tags: Corporate, Ecosystem, Enterprise. Status: live. www.boswas.co.in</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0d1629"/>
<stop offset="1" stop-color="#060b18"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#60a5fa"/>
<stop offset=".32" stop-color="#1e293b"/>
<stop offset=".68" stop-color="#1e293b"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity=".6"/>
<animateTransform attributeName="gradientTransform" type="rotate" from="0 300 180" to="360 300 180" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="rule" x1="32" y1="0" x2="568" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#60a5fa" stop-opacity=".7"/>
<stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
</linearGradient>
<linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0"/>
<stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="dotfade" cx="100%" cy="0%" r="80%">
<stop offset="0" stop-color="#fff" stop-opacity=".9"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.1" fill="#60a5fa" fill-opacity=".35"/>
</pattern>
<mask id="dm"><rect width="600" height="360" fill="url(#dotfade)"/></mask>
<clipPath id="frame"><rect width="600" height="360" rx="22"/></clipPath>
<clipPath id="ruleclip"><rect x="32" y="128" width="536" height="4"/></clipPath>
<filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="45"/></filter>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace}
.desc{font-size:18.5px;fill:#cbd5e1}
.tag{font-size:13.5px;fill:#cbd5e1;text-anchor:middle}
.glow{transform-origin:575px -10px;animation:glow 5s ease-in-out infinite}
.spark{animation:spark 4.5s ease-in-out infinite}
.dot{transform-origin:508px 54px;animation:ping 1.8s ease-out infinite}
.scanv{animation:scanv 2.4s ease-in-out infinite alternate}
.beat{transform-origin:66px 65px;animation:beat 1.6s ease-in-out infinite}
.twinkle{transform-origin:88px 47.5px;animation:twinkle 2.4s ease-in-out infinite}
.ecg{animation:ecg 2.2s linear infinite}
.cursor{animation:blink 1s steps(1) infinite}
.coin{animation:coin 2.6s ease-in infinite}
.bob{animation:bobb 2.6s ease-in-out infinite}
.rot{transform-origin:66px 66px;animation:spin 16s linear infinite}
.node{animation:node 1.75s ease-in-out infinite}
.blk{animation:blk 1.5s ease-in-out infinite}
.packet{animation:packet 1.5s ease-in-out infinite}
.nudge{animation:nudge 1.6s ease-in-out infinite}
.spinf{transform-origin:39px 325px;animation:spin 6s linear infinite}
.fu{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes glow{0%,100%{opacity:.28;transform:scale(1)}50%{opacity:.45;transform:scale(1.12)}}
@keyframes spark{0%{transform:translateX(-160px)}60%,100%{transform:translateX(620px)}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@keyframes scanv{from{transform:translateY(0)}to{transform:translateY(46px)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.45)}30%{transform:scale(1)}45%{transform:scale(1.3)}}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0deg);opacity:.4}50%{transform:scale(1.15) rotate(90deg);opacity:1}}
@keyframes ecg{from{stroke-dashoffset:100}to{stroke-dashoffset:-100}}
@keyframes blink{50%{opacity:0}}
@keyframes coin{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}55%{transform:translateY(22px);opacity:1}65%,100%{transform:translateY(24px);opacity:0}}
@keyframes bobb{0%,50%,100%{transform:translateY(0)}62%{transform:translateY(2.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes node{0%,100%{fill-opacity:.45}50%{fill-opacity:1}}
@keyframes blk{0%,100%{fill-opacity:.12}30%{fill-opacity:.75}}
@keyframes packet{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(38px);opacity:0}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
<rect width="600" height="360" fill="url(#bg)"/>
<circle class="glow" cx="575" cy="-10" r="115" fill="#60a5fa" filter="url(#blur)"/>
<rect width="600" height="360" fill="url(#dots)" mask="url(#dm)"/>
</g>
<rect x=".75" y=".75" width="598.5" height="358.5" rx="21.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="32" y="32" width="68" height="68" rx="18" fill="#60a5fa" fill-opacity=".1" stroke="#60a5fa" stroke-opacity=".45"/>
<g class="rot"><line x1="66.0" y1="45.0" x2="86.0" y2="59.5" stroke="#60a5fa" stroke-opacity=".25" stroke-width="1.5"/><line x1="86.0" y1="59.5" x2="78.3" y2="83.0" stroke="#60a5fa" stroke-opacity=".25" stroke-width="1.5"/><line x1="78.3" y1="83.0" x2="53.7" y2="83.0" stroke="#60a5fa" stroke-opacity=".25" stroke-width="1.5"/><line x1="53.7" y1="83.0" x2="46.0" y2="59.5" stroke="#60a5fa" stroke-opacity=".25" stroke-width="1.5"/><line x1="46.0" y1="59.5" x2="66.0" y2="45.0" stroke="#60a5fa" stroke-opacity=".25" stroke-width="1.5"/><line x1="66" y1="66" x2="66.0" y2="45.0" stroke="#60a5fa" stroke-opacity=".55" stroke-width="2"/><line x1="66" y1="66" x2="86.0" y2="59.5" stroke="#60a5fa" stroke-opacity=".55" stroke-width="2"/><line x1="66" y1="66" x2="78.3" y2="83.0" stroke="#60a5fa" stroke-opacity=".55" stroke-width="2"/><line x1="66" y1="66" x2="53.7" y2="83.0" stroke="#60a5fa" stroke-opacity=".55" stroke-width="2"/><line x1="66" y1="66" x2="46.0" y2="59.5" stroke="#60a5fa" stroke-opacity=".55" stroke-width="2"/><circle class="node" cx="66.0" cy="45.0" r="4" fill="#60a5fa" style="animation-delay:0.00s"/><circle class="node" cx="86.0" cy="59.5" r="4" fill="#60a5fa" style="animation-delay:0.35s"/><circle class="node" cx="78.3" cy="83.0" r="4" fill="#60a5fa" style="animation-delay:0.70s"/><circle class="node" cx="53.7" cy="83.0" r="4" fill="#60a5fa" style="animation-delay:1.05s"/><circle class="node" cx="46.0" cy="59.5" r="4" fill="#60a5fa" style="animation-delay:1.40s"/></g>
<circle cx="66" cy="66" r="7" fill="#0b1220" stroke="#60a5fa" stroke-width="2.5"/>
<g>
<text class="sans" x="120" y="66" font-size="30" font-weight="700" fill="#f8fafc">Boswas Group</text>
<text class="mono" x="121" y="93" font-size="13.5" letter-spacing="2" fill="#60a5fa">CORPORATE ECOSYSTEM</text>
</g>
<rect x="490" y="40" width="78" height="28" rx="14" fill="#0b1220"/>
<rect x="490" y="40" width="78" height="28" rx="14" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".5"/>
<circle class="dot" cx="508" cy="54" r="4" fill="#22c55e"/>
<circle cx="508" cy="54" r="4" fill="#22c55e"/>
<text class="mono" x="520" y="58.5" font-size="13" font-weight="700" letter-spacing="1.2" fill="#22c55e">LIVE</text>
<rect x="32" y="129" width="536" height="1.5" fill="url(#rule)"/>
<g clip-path="url(#ruleclip)"><rect class="spark" x="0" y="128" width="140" height="4" fill="url(#spark)"/></g>
<text class="sans desc" x="32" y="166">Corporate website showcasing the Boswas ecosystem</text><text class="sans desc" x="32" y="193">— its companies, products, innovations and long-</text><text class="sans desc" x="32" y="220">term vision across tech, healthcare, AI &amp;</text><text class="sans desc" x="32" y="247">enterprise.</text>
<rect x="32" y="270" width="100" height="28" rx="8" fill="#111c33" stroke="#24324d"/><text class="mono tag" x="82" y="289">Corporate</text><rect x="140" y="270" width="100" height="28" rx="8" fill="#111c33" stroke="#24324d"/><text class="mono tag" x="191" y="289">Ecosystem</text><rect x="249" y="270" width="109" height="28" rx="8" fill="#111c33" stroke="#24324d"/><text class="mono tag" x="304" y="289">Enterprise</text>
<g class="nudge"><path d="M34 330L44 320M37 320H44V327" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="mono" x="54" y="330.5" font-size="15" fill="#60a5fa">www.boswas.co.in</text>
<text class="mono" x="568" y="330" font-size="13" fill="#3b4a63" text-anchor="end" letter-spacing="1.5">06 / 07</text>
</svg>

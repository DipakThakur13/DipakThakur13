<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Dipak Kumar</title>
<desc id="desc">Cybersecurity Student, Full-Stack Developer and AI Builder. B.Tech CSE (Cybersecurity) at Bennett University, India.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#020617"/>
<stop offset=".55" stop-color="#0a1330"/>
<stop offset="1" stop-color="#10296b"/>
</linearGradient>
<linearGradient id="name" x1="470" y1="0" x2="1010" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
<stop offset="0" stop-color="#7dd3fc"/>
<stop offset=".25" stop-color="#f0f9ff"/>
<stop offset=".5" stop-color="#818cf8"/>
<stop offset=".75" stop-color="#38bdf8"/>
<stop offset="1" stop-color="#7dd3fc"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="540 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#38bdf8"/>
<stop offset=".3" stop-color="#1e293b" stop-opacity=".2"/>
<stop offset=".7" stop-color="#1e293b" stop-opacity=".2"/>
<stop offset="1" stop-color="#818cf8"/>
<animateTransform attributeName="gradientTransform" type="rotate" from="0 600 210" to="360 600 210" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#38bdf8"/>
<stop offset="1" stop-color="#818cf8"/>
</linearGradient>
<linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1d4ed8" stop-opacity=".55"/>
<stop offset="1" stop-color="#0f172a" stop-opacity=".2"/>
</linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
<stop offset=".8" stop-color="#38bdf8" stop-opacity=".08"/>
<stop offset=".97" stop-color="#7dd3fc" stop-opacity=".18"/>
<stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
</linearGradient>
<radialGradient id="vig" cx="50%" cy="45%" r="65%">
<stop offset="0" stop-color="#fff" stop-opacity=".9"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="sweep" cx="0" cy="1" r="1">
<stop offset="0" stop-color="#38bdf8" stop-opacity=".0"/>
<stop offset="1" stop-color="#38bdf8" stop-opacity=".35"/>
</radialGradient>
<mask id="gridMask"><rect width="1200" height="420" fill="url(#vig)"/></mask>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
<path d="M44 0H0V44" fill="none" stroke="#38bdf8" stroke-opacity=".09"/>
</pattern>
<clipPath id="frame"><rect width="1200" height="420" rx="26"/></clipPath>
<clipPath id="hex"><polygon points="250.0,118.0 329.7,164.0 329.7,256.0 250.0,302.0 170.3,256.0 170.3,164.0"/></clipPath>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="5" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow" x="-10%" y="-40%" width="120%" height="180%">
<feGaussianBlur stdDeviation="10" result="b"/>
<feColorMatrix in="b" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.74  0 0 0 0 0.97  0 0 0 .55 0" result="c"/>
<feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace}
.p{animation:rise linear infinite}
.g{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace;font-size:14px;fill:#7dd3fc;opacity:.14;animation:bob ease-in-out infinite alternate}
.orb1{animation:drift1 14s ease-in-out infinite alternate}
.orb2{animation:drift2 18s ease-in-out infinite alternate}
.orb3{animation:drift1 22s ease-in-out infinite alternate-reverse}
.gridmove{animation:grid 8s linear infinite}
.scan{animation:scan 7s linear infinite}
.spin{transform-origin:250px 210px;animation:spin 40s linear infinite}
.spinr{transform-origin:250px 210px;animation:spin 18s linear infinite reverse}
.orbit{transform-origin:250px 210px;animation:spin 7s linear infinite}
.sweep{transform-origin:250px 210px;animation:spin 4s linear infinite}
.pulse{transform-origin:250px 210px;animation:pulse 3.2s ease-out infinite}
.pulse2{animation-delay:1.6s}
.breathe{transform-origin:250px 210px;animation:breathe 4s ease-in-out infinite}
.fu{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.gl1,.gl2{opacity:0}
.gl1{animation:glitch1 6s steps(1) infinite 2s}
.gl2{animation:glitch2 6s steps(1) infinite 2s}
.blink{animation:blink 1.4s ease-in-out infinite}
.pill{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace;font-size:14px;font-weight:700;letter-spacing:1.4px;text-anchor:middle}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}80%{opacity:.5}100%{transform:translateY(-280px);opacity:0}}
@keyframes bob{from{transform:translateY(6px)}to{transform:translateY(-6px)}}
@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(60px,-30px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-80px,40px)}}
@keyframes grid{to{transform:translate(44px,44px)}}
@keyframes scan{from{transform:translateY(-140px)}to{transform:translateY(440px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.6);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes glitch1{0%{opacity:0}90%{opacity:.85;transform:translate(-5px,2px)}92%{transform:translate(4px,-1px)}94%{transform:translate(-2px,0)}96%{opacity:0}}
@keyframes glitch2{0%{opacity:0}90%{opacity:.85;transform:translate(5px,-2px)}92%{transform:translate(-4px,1px)}94%{transform:translate(2px,0)}96%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<circle class="p" cx="320" cy="323" r="1.2" fill="#7dd3fc" style="animation-duration:13.2s;animation-delay:-8.8s"/><circle class="p" cx="764" cy="154" r="1" fill="#a78bfa" style="animation-duration:12.3s;animation-delay:-2.6s"/><circle class="p" cx="55" cy="133" r="2.2" fill="#7dd3fc" style="animation-duration:16.0s;animation-delay:-15.9s"/><circle class="p" cx="119" cy="360" r="1.5" fill="#7dd3fc" style="animation-duration:14.6s;animation-delay:-10.9s"/><circle class="p" cx="941" cy="177" r="1.2" fill="#e0f2fe" style="animation-duration:11.9s;animation-delay:-9.0s"/><circle class="p" cx="798" cy="392" r="1.5" fill="#a78bfa" style="animation-duration:13.2s;animation-delay:-4.6s"/><circle class="p" cx="821" cy="278" r="1.2" fill="#7dd3fc" style="animation-duration:11.5s;animation-delay:-8.4s"/><circle class="p" cx="360" cy="151" r="1.5" fill="#a78bfa" style="animation-duration:10.0s;animation-delay:-4.6s"/><circle class="p" cx="479" cy="134" r="1.8" fill="#7dd3fc" style="animation-duration:12.4s;animation-delay:-7.0s"/><circle class="p" cx="834" cy="135" r="1.8" fill="#e0f2fe" style="animation-duration:13.2s;animation-delay:-12.6s"/><circle class="p" cx="23" cy="234" r="1" fill="#e0f2fe" style="animation-duration:9.8s;animation-delay:-4.9s"/><circle class="p" cx="761" cy="144" r="1.8" fill="#a78bfa" style="animation-duration:13.9s;animation-delay:-3.5s"/><circle class="p" cx="256" cy="380" r="1.5" fill="#7dd3fc" style="animation-duration:12.2s;animation-delay:-8.0s"/><circle class="p" cx="858" cy="162" r="2.2" fill="#38bdf8" style="animation-duration:8.3s;animation-delay:-5.9s"/><circle class="p" cx="437" cy="337" r="1.5" fill="#38bdf8" style="animation-duration:9.5s;animation-delay:-1.8s"/><circle class="p" cx="1065" cy="147" r="1.8" fill="#38bdf8" style="animation-duration:13.1s;animation-delay:-7.3s"/><circle class="p" cx="1146" cy="371" r="1" fill="#a78bfa" style="animation-duration:12.2s;animation-delay:-1.5s"/><circle class="p" cx="161" cy="193" r="1.5" fill="#
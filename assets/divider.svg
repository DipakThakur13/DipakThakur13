<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="img" aria-label="divider">
<defs>
<linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
<stop offset=".3" stop-color="#38bdf8" stop-opacity=".55"/>
<stop offset=".5" stop-color="#818cf8" stop-opacity=".8"/>
<stop offset=".7" stop-color="#38bdf8" stop-opacity=".55"/>
<stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
</linearGradient>
<linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
<stop offset=".85" stop-color="#7dd3fc" stop-opacity=".9"/>
<stop offset="1" stop-color="#f0f9ff"/>
</linearGradient>
<filter id="g" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.comet{animation:fly 5s cubic-bezier(.45,0,.55,1) infinite}
.comet2{animation-delay:2.5s}
.gem{transform-origin:600px 17px;animation:spin 6s linear infinite}
.pulse{transform-origin:600px 17px;animation:pulse 2.4s ease-out infinite}
@keyframes fly{0%{transform:translateX(-260px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(1200px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="0" y="16.25" width="1200" height="1.5" fill="url(#line)"/>
<rect class="comet" x="0" y="15.5" width="220" height="3" rx="1.5" fill="url(#comet)" filter="url(#g)"/>
<rect class="comet comet2" x="0" y="15.5" width="160" height="3" rx="1.5" fill="url(#comet)" filter="url(#g)"/>
<circle class="pulse" cx="600" cy="17" r="8" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
<g class="gem"><rect x="594" y="11" width="12" height="12" rx="2" transform="rotate(45 600 17)" fill="#0b1220" stroke="#7dd3fc" stroke-width="1.8"/></g>
<circle cx="600" cy="17" r="2.2" fill="#e0f2fe"/>
<circle cx="560" cy="17" r="2" fill="#38bdf8"/><circle cx="640" cy="17" r="2" fill="#818cf8"/>
</svg>

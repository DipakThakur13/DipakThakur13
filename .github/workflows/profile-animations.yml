name: Profile animations

# Regenerates the contribution snake and the contribution stats card,
# then publishes them to the "output" branch that the README links to.
on:
  schedule:
    - cron: "30 18 * * *" # daily at 00:00 IST
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-animations
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate contribution stats card
        id: stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/contribution_stats.py "${{ github.repository_owner }}" dist/contribution-stats.svg

      - name: Keep the previous stats card if generation failed
        if: steps.stats.outcome == 'failure'
        run: |
          mkdir -p dist
          if git fetch --depth=1 origin output; then
            git show FETCH_HEAD:contribution-stats.svg > dist/contribution-stats.svg || rm -f dist/contribution-stats.svg
          fi

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2563eb&color_dots=#ebedf0,#bae6fd,#7dd3fc,#38bdf8,#0284c7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b22,#0c4a6e,#0369a1,#0ea5e9,#7dd3fc

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile animations"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
